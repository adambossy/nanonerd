[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nanonerd"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13",
    "anthropic>=0.40",
    "fastapi>=0.115",
    "httpx>=0.27",
    "lxml>=5.2",
    "psycopg[binary]>=3.2",
    "sqlalchemy>=2.0.30",
    "trafilatura>=2.0",
    "uvicorn[standard]>=0.30",
]

[tool.setuptools]
package-dir = {"nanonerd" = "src/nanonerd"}

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["nanonerd*"]

[tool.deadcode]
# NOTE: deadcode matches these patterns against the full relative path with
# fnmatch (glob semantics, `*` crosses `/`), anchored on the *entire* string.
# A pattern ending in `/` (e.g. ".venv/") can therefore never match, since no
# walked path ever ends with a trailing slash — every entry below uses a
# trailing `*` instead so it matches both the directory itself and everything
# nested under it.
exclude = [
    ".venv",
    ".venv/*",
    "build",
    "build/*",
    "dist",
    "dist/*",
    "**/site-packages/*",
    "migrations",
    "migrations/*",
    "web",
    "web/*",
]
ignore-names = [
    "__all__",
    "__doc__",
    "__path__",
    "__version__",
    "_",
    "logger",
    "LOGGER",
    "*_fixture",
    # Persisted audit/debug timestamp column: set in the pipeline, not read
    # back by any current code path, but is a real schema field kept for
    # observability/future use, not dead code.
    "extracted_at",
    # Updated on every sync tick to track session liveness; not read back by
    # any current code path, but a real schema field kept for
    # observability/future use, not dead code.
    "last_active_at",
]
ignore-names-in-files = [
    "*/__init__.py",
    "tests/**",
    "test/**",
    "src/nanonerd/reader/api.py",
    "src/nanonerd/reader/main.py",
    "src/nanonerd/reader/stats.py",
]
ignore-definitions = [
    "Migration",
    "*Migration",
]
ignore-definitions-if-inherits-from = [
    "BaseModel",
    "Schema",
    "Settings",
]

[dependency-groups]
dev = [
    "deadcode>=2.4.1",
    "lxml-stubs>=0.5",
    "mypy>=1.18.2",
    "pytest>=9.0.0",
    "ruff>=0.14.4",
]
