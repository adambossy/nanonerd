[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nanonerd"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13",
    "anthropic>=0.40",
    "fastapi>=0.115",
    "httpx>=0.27",
    "lxml>=5.2",
    "psycopg[binary]>=3.2",
    "sqlalchemy>=2.0.30",
    "trafilatura>=2.0",
    "uvicorn[standard]>=0.30",
]

[tool.setuptools]
package-dir = {"nanonerd" = "src/nanonerd"}

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["nanonerd*"]

[tool.deadcode]
exclude = [
    ".venv/",
    "build/",
    "dist/",
    "**/site-packages/",
    "migrations/",
    "web/",
]
ignore-names = [
    "__all__",
    "__doc__",
    "__path__",
    "__version__",
    "_",
    "logger",
    "LOGGER",
    "*_fixture",
]
ignore-names-in-files = [
    "*/__init__.py",
    "tests/**",
    "test/**",
    "src/nanonerd/reader/api.py",
    "src/nanonerd/reader/main.py",
]
ignore-definitions = [
    "Migration",
    "*Migration",
]
ignore-definitions-if-inherits-from = [
    "BaseModel",
    "Schema",
    "Settings",
]

[dependency-groups]
dev = [
    "deadcode>=2.4.1",
    "lxml-stubs>=0.5",
    "mypy>=1.18.2",
    "pytest>=9.0.0",
    "ruff>=0.14.4",
]
