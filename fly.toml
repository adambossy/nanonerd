app = "nanonerd-reader"
primary_region = "ewr"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  # Faithful-snapshot capture runs headless Chromium in-process (one page at a
  # time). 256MB is not enough for Chromium + uvicorn; 1GB is the practical
  # floor. Cost-bearing, so left as a proposal — uncomment to enable:
  # memory = "1gb"
