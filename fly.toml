app = "nanonerd-reader"
primary_region = "ewr"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  # Article extraction launches headless Chromium per save; the default 256MB
  # for shared-cpu-1x OOMs on image-heavy pages. 1GB keeps one render plus
  # the API comfortably in memory (roughly doubles the machine's hourly cost).
  memory = "1gb"
